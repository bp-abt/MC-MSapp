App:
  Properties:
    OnStart: |-
      =
      Set(varColorAppBg, ColorValue("#F7F7F7"));
      Set(varColorCardBg, ColorValue("#FFFFFF"));
      Set(varColorTextPrimary, ColorValue("#1A1A1A"));
      Set(varColorTextSecondary, ColorValue("#333333"));
      Set(varColorSectionBg, ColorValue("#E8EEF7"));
      Set(varColorSectionText, ColorValue("#0F1F33"));
      Set(varColorPrimary, ColorValue("#005A9E"));
      Set(varColorPrimaryText, ColorValue("#FFFFFF"));
      Set(varColorError, ColorValue("#B00020"));
      Set(varColorWarningBg, ColorValue("#FFF4CE"));
      Set(varColorWarningText, ColorValue("#3B2F00"));
      Set(varColorSuccessBg, ColorValue("#E6F4EA"));
      Set(varColorSuccessText, ColorValue("#0B3D1E"));
    Theme: =PowerAppsTheme
