            - risk_level_DataCard2:
                Control: TypedDataCard@1.0.7
                Variant: PcfCoreNumberEditCard
                Properties:
                  BorderColor: =RGBA(119, 77, 3, 1)
                  DataField: ="field_21"
                  Default: =ThisItem.risk_level
                  DisplayName: =DataSourceInfo([@SupervisionTool_format],DataSourceInfo.DisplayName,'risk_level')
                  Height: =82
                  Required: =false
                  Update: |-
                    =If((Coalesce(rdoPTF1DrugAlcohol.Selected.Code, 0) + Coalesce(rdoPTF2Residency.Selected.Code, 0) + Coalesce(rdoPTF3Age.Selected.Code, 0) + Coalesce(rdoPTF4Gender.Selected.Code, 0) + Coalesce(rdoPTF5Employment.Selected.Code, 0) + (Coalesce(rdoPTF6Treatment.Selected.Code, 0) + Coalesce(rdoPTF6Social.Selected.Code, 0) + Coalesce(rdoPTF6NoFTA.Selected.Code, 0) + Coalesce(rdoPTF6Phone.Selected.Code, 0))) >= 10, 3, If((Coalesce(rdoPTF1DrugAlcohol.Selected.Code, 0) + Coalesce(rdoPTF2Residency.Selected.Code, 0) + Coalesce(rdoPTF3Age.Selected.Code, 0) + Coalesce(rdoPTF4Gender.Selected.Code, 0) + Coalesce(rdoPTF5Employment.Selected.Code, 0) + (Coalesce(rdoPTF6Treatment.Selected.Code, 0) + Coalesce(rdoPTF6Social.Selected.Code, 0) + Coalesce(rdoPTF6NoFTA.Selected.Code, 0) + Coalesce(rdoPTF6Phone.Selected.Code, 0))) >= 6, 2, 1))
                  Width: =888
                  X: =0
                  Y: =21
                Children:
                  - risk_level_DataCard2_label:
                      Control: FluentV8/Label@1.8.6
                      Properties:
                        AccessibleLabel: ="RISK LEVEL (1=Low, 2=Moderate, 3=High)"
                        FontSize: =12
                        FontWeight: =FontWeight.Bold
                        Text: |-
                          ="RISK LEVEL (1=Low, 2=Moderate, 3=High): " & Text(If((Coalesce(rdoPTF1DrugAlcohol.Selected.Code, 0) + Coalesce(rdoPTF2Residency.Selected.Code, 0) + Coalesce(rdoPTF3Age.Selected.Code, 0) + Coalesce(rdoPTF4Gender.Selected.Code, 0) + Coalesce(rdoPTF5Employment.Selected.Code, 0) + (Coalesce(rdoPTF6Treatment.Selected.Code, 0) + Coalesce(rdoPTF6Social.Selected.Code, 0) + Coalesce(rdoPTF6NoFTA.Selected.Code, 0) + Coalesce(rdoPTF6Phone.Selected.Code, 0))) >= 10, 3, If((Coalesce(rdoPTF1DrugAlcohol.Selected.Code, 0) + Coalesce(rdoPTF2Residency.Selected.Code, 0) + Coalesce(rdoPTF3Age.Selected.Code, 0) + Coalesce(rdoPTF4Gender.Selected.Code, 0) + Coalesce(rdoPTF5Employment.Selected.Code, 0) + (Coalesce(rdoPTF6Treatment.Selected.Code, 0) + Coalesce(rdoPTF6Social.Selected.Code, 0) + Coalesce(rdoPTF6NoFTA.Selected.Code, 0) + Coalesce(rdoPTF6Phone.Selected.Code, 0))) >= 6, 2, 1)))
